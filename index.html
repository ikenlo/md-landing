<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Head copy stays static: link-preview scrapers don't run JS (see js/content.js) -->
  <title>M&amp;D Beauty Studio — Перукарська студія у Нових Петрівцях</title>
  <meta name="description" content="M&amp;D Beauty Studio — сучасна перукарська студія у Нових Петрівцях. Жіночі та чоловічі стрижки, догляд за волоссям. Запис у Telegram.">
  <meta name="theme-color" content="#051C15">

  <!-- Open Graph -->
  <meta property="og:title" content="M&amp;D Beauty Studio">
  <meta property="og:description" content="Перукарська студія, де деталі мають значення. Нові Петрівці.">
  <meta property="og:image" content="assets/img/og-preview.jpg">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="uk_UA">

  <!-- Marks the document as JS-capable before first paint -->
  <script>document.documentElement.classList.add('js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Without JS nothing can dismiss the preloader, so never show it -->
  <noscript><style>.preloader { display: none; }</style></noscript>
</head>
<body>

  <!-- All visible copy is injected from js/content.js via data-t / data-list -->

  <a class="skip-link" href="#main" data-t="a11y.skip"></a>

  <!-- ============ PRELOADER ============ -->
  <div class="preloader" id="preloader" role="status" data-t-attr="aria-label:a11y.loading">
    <div class="preloader__inner">
      <svg class="monogram" viewBox="0 0 200 200" fill="none" aria-hidden="true" focusable="false">
        <circle class="monogram__ring" cx="100" cy="100" r="94" pathLength="1" transform="rotate(-90 100 100)"/>
        <path class="monogram__letter" pathLength="1" d="M30 134 V66 L56 110 L82 66 V134"/>
        <path class="monogram__amp" pathLength="1" transform="translate(2.5 0)" d="M112 118 L96.5 96.5 C92.5 91 94.5 84 100 84 C105.5 84 107 90.5 102.5 94 L95 99.5 C87.5 105 89 116.5 98.5 117.5 C105 118 109.5 112.5 111 104.5"/>
        <path class="monogram__letter" pathLength="1" d="M124 66 V134 H138 C159 134 172 120 172 100 C172 80 159 66 138 66 H124"/>
      </svg>
      <p class="preloader__caption" data-t="brand.tagline"></p>
    </div>
  </div>

  <!-- ============ NAVIGATION ============ -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__logo" href="#top" data-t-attr="aria-label:a11y.logo">
        M<span class="nav__logo-amp">&amp;</span>D
      </a>

      <!-- Desktop enhancement: inline links + CTA -->
      <nav class="nav__links" data-list="nav.links" data-t-attr="aria-label:a11y.navMain">
        <template>
          <a class="nav__link" data-t="label" data-t-attr="href:href"></a>
        </template>
      </nav>
      <button class="btn btn--gold nav__cta" type="button" data-open-booking data-t="nav.cta"></button>

      <button class="nav__burger" id="navBurger" type="button"
              aria-expanded="false" aria-controls="menu" data-t-attr="aria-label:a11y.menuOpen">
        <span class="nav__burger-line"></span>
        <span class="nav__burger-line"></span>
      </button>
    </div>
  </header>

  <!-- ============ MOBILE MENU ============
       Lives outside <header>: backdrop-filter on the nav would otherwise
       become the containing block for this fixed overlay. -->
  <div class="menu" id="menu" role="dialog" aria-modal="true" data-t-attr="aria-label:a11y.menu" inert>
    <nav class="menu__nav" data-lenis-prevent data-t-attr="aria-label:a11y.navMobile">
      <ul class="menu__list" data-list="nav.links">
        <template>
          <li class="menu__item">
            <a class="menu__link" data-t-attr="href:href"><span class="menu__link-inner" data-t="label"></span></a>
          </li>
        </template>
      </ul>
    </nav>
    <div class="menu__footer">
      <button class="btn btn--gold btn--block menu__cta" type="button" data-open-booking data-t="nav.cta"></button>
    </div>
  </div>

  <!-- ============ CONTENT ============ -->
  <main id="main">

    <!-- HERO -->
    <section class="hero" id="top">
      <div class="hero__media" aria-hidden="true">
        <picture>
          <source media="(min-width: 48rem)" srcset="assets/img/hero-desktop.jpg" width="1920" height="1200">
          <img class="hero__img" src="assets/img/hero-mobile.jpg" alt="" width="900" height="1600"
               fetchpriority="high" decoding="async">
        </picture>
        <div class="hero__overlay"></div>
      </div>

      <div class="hero__content container">
        <p class="eyebrow" data-hero-fade data-t="hero.eyebrow"></p>
        <h1 class="hero__title" data-hero-fade>
          <span class="visually-hidden" data-t="hero.title"></span>
          <svg class="hero__logo" viewBox="24 60 154 80" fill="none" aria-hidden="true" focusable="false">
            <path class="hero__logo-letter" d="M30 134 V66 L56 110 L82 66 V134"/>
            <path class="hero__logo-amp" transform="translate(2.5 0)" d="M112 118 L96.5 96.5 C92.5 91 94.5 84 100 84 C105.5 84 107 90.5 102.5 94 L95 99.5 C87.5 105 89 116.5 98.5 117.5 C105 118 109.5 112.5 111 104.5"/>
            <path class="hero__logo-letter" d="M124 66 V134 H138 C159 134 172 120 172 100 C172 80 159 66 138 66 H124"/>
          </svg>
        </h1>
        <p class="hero__subhead" data-hero-fade data-t="hero.subhead"></p>
        <button class="btn btn--gold hero__cta" type="button" data-open-booking data-hero-fade data-t="hero.cta"></button>
      </div>

      <div class="hero__scroll" aria-hidden="true" data-hero-fade>
        <span class="hero__scroll-line"></span>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="section about" id="about">
      <div class="container about__grid">
        <div class="about__text">
          <p class="eyebrow" data-reveal data-t="about.eyebrow"></p>
          <h2 class="section__title" data-reveal data-t="about.title"></h2>
          <div class="about__body" data-list="about.paragraphs">
            <template>
              <p data-reveal data-t="."></p>
            </template>
          </div>
        </div>
        <figure class="about__media" data-reveal>
          <img class="about__img" src="assets/img/about.jpg" width="1200" height="1500"
               loading="lazy" decoding="async" data-parallax data-t-attr="alt:about.imageAlt">
        </figure>
      </div>
    </section>

    <!-- PRINCIPLES -->
    <section class="section section--alt principles" id="principles">
      <div class="container">
        <header class="section__head">
          <p class="eyebrow" data-reveal data-t="principles.eyebrow"></p>
          <h2 class="section__title" data-reveal data-t="principles.title"></h2>
        </header>
        <ol class="principles__list" data-list="principles.items">
          <template>
            <li class="principle" data-reveal>
              <span class="principle__num" aria-hidden="true" data-index></span>
              <h3 class="principle__title" data-t="title"></h3>
              <p class="principle__text" data-t="text"></p>
            </li>
          </template>
        </ol>
      </div>
    </section>

    <!-- SERVICES -->
    <section class="section services" id="services">
      <div class="container">
        <header class="section__head">
          <p class="eyebrow" data-reveal data-t="services.eyebrow"></p>
          <h2 class="section__title" data-reveal data-t="services.title"></h2>
        </header>
        <ul class="services__grid" data-list="services.items">
          <template>
            <li class="service" data-reveal>
              <span class="service__num" aria-hidden="true" data-index></span>
              <h3 class="service__name" data-t="name"></h3>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- GALLERY -->
    <section class="section section--alt gallery" id="gallery">
      <div class="container">
        <header class="section__head">
          <p class="eyebrow" data-reveal data-t="gallery.eyebrow"></p>
          <h2 class="section__title" data-reveal data-t="gallery.title"></h2>
        </header>
        <ul class="gallery__grid" data-list="gallery.items">
          <template>
            <li data-reveal>
              <button class="gallery__item" type="button">
                <img class="gallery__img" width="1100" height="1100" loading="lazy" decoding="async"
                     data-t-attr="src:src;alt:alt">
              </button>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- VISIT — timeline; the gold line is drawn by scroll (see animations.js) -->
    <section class="section visit" id="visit">
      <div class="container">
        <header class="section__head">
          <p class="eyebrow" data-reveal data-t="visit.eyebrow"></p>
          <h2 class="section__title" data-reveal data-t="visit.title"></h2>
        </header>
        <div class="visit__timeline">
          <!-- mobile: vertical rail -->
          <svg class="visit__line visit__line--v" viewBox="0 0 2 100" preserveAspectRatio="none" fill="none" aria-hidden="true" focusable="false">
            <path class="visit__track" d="M1 0 V100"/>
            <path class="visit__progress" d="M1 0 V100" pathLength="1"/>
          </svg>
          <!-- desktop: horizontal rail -->
          <svg class="visit__line visit__line--h" viewBox="0 0 100 2" preserveAspectRatio="none" fill="none" aria-hidden="true" focusable="false">
            <path class="visit__track" d="M0 1 H100"/>
            <path class="visit__progress" d="M0 1 H100" pathLength="1"/>
          </svg>
          <ol class="visit__steps" data-list="visit.steps">
            <template>
              <li class="step">
                <span class="step__dot" aria-hidden="true"></span>
                <div data-reveal>
                  <span class="step__num" aria-hidden="true" data-index></span>
                  <h3 class="step__title" data-t="title"></h3>
                  <p class="step__text" data-t="text"></p>
                </div>
              </li>
            </template>
          </ol>
        </div>
      </div>
    </section>

    <!-- CTA & CONTACTS -->
    <section class="section contacts" id="contacts">
      <div class="container">
        <p class="eyebrow" data-reveal data-t="contacts.eyebrow"></p>
        <h2 class="contacts__title" data-reveal data-t="contacts.title"></h2>
        <p class="contacts__lead" data-reveal data-t="contacts.lead"></p>
        <div data-reveal>
          <button class="btn btn--gold contacts__cta" type="button" data-open-booking data-t="contacts.cta"></button>
        </div>

        <ul class="contacts__rows">
          <li data-reveal>
            <a class="contact-row" data-t-attr="href:contacts.phone.href">
              <span class="contact-row__label" data-t="contacts.phone.label"></span>
              <span class="contact-row__value" data-t="contacts.phone.value"></span>
              <svg class="contact-row__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M7 17 17 7M9 7h8v8"/></svg>
            </a>
          </li>
          <li data-reveal>
            <a class="contact-row" target="_blank" rel="noopener" data-t-attr="href:contacts.address.href">
              <span class="contact-row__label" data-t="contacts.address.label"></span>
              <span class="contact-row__value" data-t="contacts.address.value"></span>
              <svg class="contact-row__arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M7 17 17 7M9 7h8v8"/></svg>
            </a>
          </li>
        </ul>
      </div>
    </section>

  </main>

  <footer class="footer" id="footer">
    <div class="container">
      <p class="footer__copy" data-t="footer.copy"></p>
    </div>
  </footer>

  <!-- ============ FLOATING CTA (mobile only) ============ -->
  <button class="fab btn btn--gold" id="fab" type="button" data-open-booking data-t="nav.cta"></button>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" tabindex="-1" inert
       data-t-attr="aria-label:a11y.lightbox">
    <div class="lightbox__bar">
      <p class="lightbox__counter" aria-live="polite"></p>
      <button class="icon-btn" type="button" data-close-overlay data-t-attr="aria-label:a11y.close">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5 5 19"/></svg>
      </button>
    </div>
    <div class="lightbox__stage">
      <img class="lightbox__img" alt="" draggable="false">
    </div>
    <div class="lightbox__nav">
      <button class="icon-btn icon-btn--ring lightbox__prev" type="button" data-t-attr="aria-label:a11y.prevPhoto">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
      </button>
      <button class="icon-btn icon-btn--ring lightbox__next" type="button" data-t-attr="aria-label:a11y.nextPhoto">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <!-- ============ BOOKING MODAL (mockup — no backend yet) ============ -->
  <div class="modal" id="booking" role="dialog" aria-modal="true" aria-labelledby="bookingTitle" inert>
    <div class="modal__backdrop" data-close-overlay></div>
    <div class="modal__panel" tabindex="-1" data-lenis-prevent>
      <button class="icon-btn modal__close" type="button" data-close-overlay data-t-attr="aria-label:a11y.close">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5 5 19"/></svg>
      </button>

      <div class="booking__form-view">
        <p class="eyebrow" data-t="booking.eyebrow"></p>
        <h2 class="modal__title" id="bookingTitle" data-t="booking.title"></h2>
        <p class="modal__lead" data-t="booking.lead"></p>

        <form class="form" id="bookingForm" novalidate>
          <div class="field">
            <label class="field__label" for="bookingName" data-t="booking.name.label"></label>
            <input class="field__control" id="bookingName" name="name" type="text" autocomplete="name"
                   aria-describedby="bookingNameError" data-t-attr="placeholder:booking.name.placeholder">
            <p class="field__error" id="bookingNameError" data-t="booking.name.error"></p>
          </div>
          <div class="field">
            <label class="field__label" for="bookingPhone" data-t="booking.phone.label"></label>
            <input class="field__control" id="bookingPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel"
                   aria-describedby="bookingPhoneError" data-t-attr="placeholder:booking.phone.placeholder">
            <p class="field__error" id="bookingPhoneError" data-t="booking.phone.error"></p>
          </div>
          <div class="field">
            <label class="field__label" for="bookingService" data-t="booking.service.label"></label>
            <select class="field__control field__control--select" id="bookingService" name="service"
                    aria-describedby="bookingServiceError" data-list="services.items">
              <option value="" selected data-t="booking.service.placeholder"></option>
              <template>
                <option data-t="name" data-t-attr="value:name"></option>
              </template>
            </select>
            <p class="field__error" id="bookingServiceError" data-t="booking.service.error"></p>
          </div>
          <button class="btn btn--gold btn--block" type="submit" data-t="booking.submit"></button>
        </form>
      </div>

      <div class="booking__success" hidden tabindex="-1">
        <svg class="booking__check" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
          <circle cx="24" cy="24" r="23"/><path d="M15 24.5l6.5 6.5L34 18"/>
        </svg>
        <h2 class="modal__title" data-t="booking.success.title"></h2>
        <p class="modal__lead" data-t="booking.success.text"></p>
        <button class="btn btn--gold btn--block" type="button" data-close-overlay data-t="booking.success.button"></button>
      </div>
    </div>
  </div>

  <!-- ============ SCRIPTS ============ -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
  <script defer src="js/content.js"></script>
  <script defer src="js/animations.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
